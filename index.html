<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1000">
    <title>LogSnap - 로그 발췌 메이커</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&family=Nanum+Myeongjo:wght@400;700&family=Gowun+Dodum&family=Gowun+Batang&display=swap" rel="stylesheet">
    
    <style>
        @font-face { font-family: 'RIDIBatang'; src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_twelve@1.0/RIDIBatang.woff') format('woff'); font-weight: normal; font-style: normal; }
        @font-face { font-family: 'NeoDunggeunmo'; src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.3/NeoDunggeunmo.woff') format('woff'); font-weight: normal; font-style: normal; }
        @font-face { font-family: 'Pretendard-Regular'; src: url('https://cdn.jsdelivr.net/gh/Project-Noonnu/noonfonts_2107@1.1/Pretendard-Regular.woff') format('woff'); font-weight: 400; font-style: normal; }
        @font-face { font-family: 'MaruBuri'; src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2010-2107@1.0/MaruBuri-Regular.woff') format('woff'); font-weight: normal; font-style: normal; }
        @font-face { font-family: 'KyoboHandwriting2019'; src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_20-04@1.0/KyoboHandwriting2019.woff') format('woff'); font-weight: normal; font-style: normal; }
        @font-face { font-family: 'SpoqaHanSansNeo-Regular'; src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2108@1.1/SpoqaHanSansNeo-Regular.woff') format('woff'); font-weight: normal; font-style: normal; }
        @font-face { font-family: 'SUIT-Regular'; src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_suit@1.0/SUIT-Regular.woff2') format('woff2'); font-weight: normal; font-style: normal; }

        :root {
            --bg-color: #ffffff;
            --text-color: #303030;
            --footer-color: #333333;
            --footer-size: 13px;
            --footer-space: -1px;
            --p-gap: 12px;
            --padding: 80px;
            --border-style: none;
        }

        * { box-sizing: border-box; }

        body { 
            font-family: 'Pretendard-Regular', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; 
            display: flex; 
            flex-direction: row; 
            background: #f4f6f8; 
            margin: 0; 
            height: 100vh; 
            color: #333;
            overflow: hidden; 
        }

        #sidebar { 
            width: 320px; 
            background: #fff; 
            padding: 25px; 
            box-shadow: 2px 0 15px rgba(0,0,0,0.03); 
            display: flex; 
            flex-direction: column; 
            gap: 20px; 
            overflow-y: auto; 
            border-right: 1px solid #e9ecef;
            flex-shrink: 0;
        }
        #sidebar::-webkit-scrollbar { width: 6px; }
        #sidebar::-webkit-scrollbar-thumb { background: #ced4da; border-radius: 3px; }

        .logo { font-size: 22px; font-weight: 700; margin-bottom: 10px; color: #212529; letter-spacing: -0.5px; }
        .section-title { font-size: 13px; font-weight: 700; color: #868e96; margin-bottom: 8px; text-transform: uppercase; }
        
        .control-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 15px; }
        .control-group label { font-size: 13px; font-weight: 600; color: #495057; display: flex; justify-content: space-between;}
        
        input[type="range"] { accent-color: #495057; cursor: pointer; }
        select, input[type="text"] { padding: 8px; border: 1px solid #ced4da; border-radius: 6px; font-family: inherit; font-size: 13px; outline: none; }
        select { cursor: pointer; }
        
        .btn-row { display: flex; gap: 8px; }
        button { 
            padding: 10px; cursor: pointer; border: none; border-radius: 6px; 
            font-weight: 600; font-size: 13px; transition: all 0.2s; 
            display: flex; align-items: center; justify-content: center; gap: 5px;
        }
        button:hover { filter: brightness(0.95); }
        
        .btn-action { background: #f1f3f5; color: #212529; flex: 1; }
        .btn-hl { background: #e9ecef; color: #212529; flex: 1; }
        .btn-clear { background: #ffffff; border: 1px solid #ced4da; color: #495057; }
        
        .btn-primary { background: #212529; color: #fff; font-size: 15px; padding: 14px; margin-top: 10px; }
        .btn-primary:hover { background: #000; }

        #main { 
            flex-grow: 1; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            padding: 40px; 
            overflow-y: auto; 
            background: repeating-linear-gradient(45deg, #f1f3f5, #f1f3f5 10px, #f8f9fa 10px, #f8f9fa 20px);
        }
        
        #capture-wrapper { 
            background-color: var(--bg-color);
            padding: var(--padding); 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); 
            transition: padding 0.2s, background-color 0.3s, width 0.3s;
            display: flex;
            flex-direction: column;
            font-family: 'Pretendard-Regular', 'Apple SD Gothic Neo', sans-serif;
            border: var(--border-style);
        }

        #capture-wrapper.portrait { width: 480px; min-height: 640px; }
        #capture-wrapper.landscape { width: 800px; min-height: 400px; }

        #editor { 
            flex-grow: 1;
            outline: none; 
            font-size: 16px; 
            line-height: 1.4; 
            letter-spacing: -1px; 
            word-break: keep-all;
            color: var(--text-color);
            transition: color 0.3s;
            padding-right: 2px;
            text-align: justify; 
            text-justify: inter-word; 
            overflow-wrap: break-word; 
        }
        #editor p, #editor div { margin-top: 0; margin-bottom: var(--p-gap); }
        #editor strong { font-weight: 700; }
        
        #editor span, #editor font, #editor b, #editor strong {
            -webkit-box-decoration-break: clone;
            box-decoration-break: clone;
        }

        #footer-display {
            align-self: flex-end;
            margin-top: 50px;
            padding-right: 14px;
            border-right: 2px solid var(--footer-color);
            font-size: var(--footer-size);
            color: var(--footer-color);
            opacity: 0.65;
            font-weight: 500;
            letter-spacing: var(--footer-space);
            word-break: keep-all;
            text-align: right;
            line-height: 1.4;
            transition: all 0.3s;
        }

        #footer-display:empty {
            display: none !important;
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <div class="logo">LogSnap</div>

        <div>
            <div class="section-title">본문 텍스트 설정</div>
            
            <div class="control-group">
                <label>본문 폰트 (글꼴)</label>
                <select id="fontFamily">
                    <optgroup label="[사진 속 그 폰트! / 깔끔 고딕]">
                        <option value="'Pretendard-Regular', sans-serif">프리텐다드 (추천)</option>
                        <option value="'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">애플/맑은 고딕 (기본)</option>
                        <option value="'SpoqaHanSansNeo-Regular', sans-serif">스포카 한 산스 네오</option>
                        <option value="'SUIT-Regular', sans-serif">SUIT (수트)</option>
                        <option value="'Noto Sans KR', sans-serif">노토산스</option>
                        <option value="'Gowun Dodum', sans-serif">고운돋움</option>
                    </optgroup>
                    <optgroup label="[소설 / 감성 바탕체]">
                        <option value="'RIDIBatang', serif">리디바탕</option>
                        <option value="'MaruBuri', serif">마루부리</option>
                        <option value="'Gowun Batang', serif">고운바탕</option>
                        <option value="'Nanum Myeongjo', serif">나눔명조</option>
                    </optgroup>
                    <optgroup label="[개성 / 특수]">
                        <option value="'KyoboHandwriting2019', cursive">교보 손글씨</option>
                        <option value="'NeoDunggeunmo', monospace">둥근모 (픽셀)</option>
                    </optgroup>
                </select>
            </div>

            <div class="control-group">
                <label>정렬 방식</label>
                <select id="textAlign">
                    <option value="left">왼쪽 정렬 (기본)</option>
                    <option value="justify" selected>양쪽 정렬 (소설책 느낌)</option>
                    <option value="center">가운데 정렬 (시/대사 느낌)</option>
                </select>
            </div>

            <div class="control-group">
                <label>본문 글자색 <span style="font-size:10px; font-weight:normal; color:#868e96;">(색 안바뀌면 서식 지우기)</span></label>
                <input type="color" id="textColor" value="#303030" style="width: 100%; height: 30px; border: 1px solid #ced4da; border-radius: 6px; padding: 2px; cursor: pointer;">
            </div>

            <div class="control-group">
                <label>글씨 크기 <span id="val-size">16px</span></label>
                <input type="range" id="fontSize" min="12" max="40" value="16">
            </div>
            <div class="control-group">
                <label>자간 (글자 간격) <span id="val-space">-1px</span></label>
                <input type="range" id="letterSpacing" min="-3" max="10" value="-1" step="0.5">
            </div>
            <div class="control-group">
                <label>줄 간격 <span id="val-line">1.4</span></label>
                <input type="range" id="lineHeight" min="1" max="3" value="1.4" step="0.1">
            </div>
            <div class="control-group">
                <label>문단 폭 (엔터 간격) <span id="val-pgap">12px</span></label>
                <input type="range" id="pSpacing" min="0" max="50" value="12" step="1">
            </div>
        </div>

        <hr style="border: 0; border-top: 1px solid #f1f3f5;">

        <div>
            <div class="section-title">꾸미기</div>
            <div class="control-group">
                <label>부분 꾸미기 (글자 드래그 후 클릭!)</label>
                <div class="btn-row" style="margin-bottom: 4px;">
                    <button class="btn-action" style="flex: 0.4; font-weight: 900; font-size: 15px;" onclick="applyBold()" title="굵게">B</button>
                    <input type="color" id="partColor" value="#e03131" style="width: 38px; height: 38px; padding: 0; border: 1px solid #ced4da; border-radius: 6px; cursor: pointer;">
                    <button class="btn-action" onclick="applyPartColor()">글자색 적용</button>
                </div>
                <div class="btn-row">
                    <input type="color" id="hlColor" value="#d3d3d3" style="width: 38px; height: 38px; padding: 0; border: 1px solid #ced4da; border-radius: 6px; cursor: pointer;">
                    <button class="btn-hl" onclick="applyHighlight()">형광펜 칠하기</button>
                    <button class="btn-clear" onclick="removeFormat()">서식 지우기</button>
                </div>
            </div>
        </div>

        <hr style="border: 0; border-top: 1px solid #f1f3f5;">

        <div>
            <div class="section-title">형태 & 배경</div>
            <div class="control-group">
                <label>캔버스 비율 (방향)</label>
                <select id="orientation">
                    <option value="portrait">세로형 (책 비율)</option>
                    <option value="landscape" selected>가로형 (넓은 비율)</option>
                </select>
            </div>
            <div class="control-group">
                <label>테두리 스타일</label>
                <select id="borderStyle">
                    <option value="none">없음</option>
                    <option value="1px solid var(--text-color)">얇은 실선</option>
                    <option value="4px double var(--text-color)">고급스러운 두 줄</option>
                </select>
            </div>
            <div class="control-group">
                <label>여백 넓히기 <span id="val-padding">80px</span></label>
                <input type="range" id="bgPadding" min="20" max="150" value="80" step="5">
            </div>
            <div class="control-group">
                <label>배경색 선택</label>
                <input type="color" id="bgColor" value="#ffffff" style="width: 100%; height: 30px; border: 1px solid #ced4da; border-radius: 6px; padding: 2px; cursor: pointer;">
            </div>
        </div>

        <hr style="border: 0; border-top: 1px solid #f1f3f5;">
        
        <div>
            <div class="section-title">꼬리말 설정</div>
            
            <!-- 작품 제목 선택 & 입력 -->
            <div class="control-group">
                <label>작품 제목</label>
                <select id="titleSelect" style="margin-bottom: 4px;">
                    <option value="">직접 입력 (아래 빈칸 사용)</option>
                    <option value="맨즈 지하돌이 뭐야?">맨즈 지하돌이 뭐야?</option>
                    <option value="따분한 여름의, 안녕">따분한 여름의, 안녕</option>
                    <option value="네게 불행은 없다">네게 불행은 없다</option>
                </select>
                <input type="text" id="footerTitle" placeholder="작품 제목 입력">
            </div>
            
            <!-- 저자 선택 & 입력 -->
            <div class="control-group">
                <label>저자</label>
                <select id="authorSelect" style="margin-bottom: 4px;">
                    <option value="">직접 입력 (아래 빈칸 사용)</option>
                    <option value="검머단">검머단</option>
                    <option value="모모링">모모링</option>
                </select>
                <input type="text" id="footerAuthor" placeholder="저자 입력">
            </div>

            <div class="control-group">
                <label>꼬리말 폰트</label>
                <select id="footerFontFamily">
                    <option value="inherit">본문 폰트와 동일하게 (기본)</option>
                    <option value="'Pretendard-Regular', sans-serif">프리텐다드</option>
                    <option value="'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">애플/맑은 고딕</option>
                    <option value="'SpoqaHanSansNeo-Regular', sans-serif">스포카 한 산스 네오</option>
                    <option value="'SUIT-Regular', sans-serif">SUIT (수트)</option>
                    <option value="'Noto Sans KR', sans-serif">노토산스</option>
                    <option value="'Gowun Dodum', sans-serif">고운돋움</option>
                    <option value="'RIDIBatang', serif">리디바탕</option>
                    <option value="'MaruBuri', serif">마루부리</option>
                    <option value="'Gowun Batang', serif">고운바탕</option>
                    <option value="'Nanum Myeongjo', serif">나눔명조</option>
                    <option value="'KyoboHandwriting2019', cursive">교보 손글씨</option>
                    <option value="'NeoDunggeunmo', monospace">둥근모 (픽셀)</option>
                </select>
            </div>
            <div class="control-group">
                <label>꼬리말 크기 <span id="val-footer-size">13px</span></label>
                <input type="range" id="footerFontSize" min="10" max="30" value="13">
            </div>
            <div class="control-group">
                <label>꼬리말 자간 <span id="val-footer-space">-1px</span></label>
                <input type="range" id="footerLetterSpacing" min="-3" max="10" value="-1" step="0.5">
            </div>
            <div class="control-group">
                <label>꼬리말 색상</label>
                <input type="color" id="footerColor" value="#333333" style="width: 100%; height: 30px; border: 1px solid #ced4da; border-radius: 6px; padding: 2px; cursor: pointer;">
            </div>
        </div>

        <button class="btn-primary" onclick="downloadImage()">이미지 저장 (다운로드)</button>
    </div>

    <div id="main">
        <div id="capture-wrapper" class="landscape">
            <div id="editor" contenteditable="true">
                <div>여기에 로그를 복사해서 붙여넣으세요.</div>
            </div>
            <div id="footer-display"></div>
        </div>
    </div>

    <script>
        const editor = document.getElementById('editor');
        const root = document.documentElement;
        const captureWrapper = document.getElementById('capture-wrapper');
        const footerDisplay = document.getElementById('footer-display');
        
        const titleSelect = document.getElementById('titleSelect');
        const authorSelect = document.getElementById('authorSelect');
        const footerTitleInput = document.getElementById('footerTitle');
        const footerAuthorInput = document.getElementById('footerAuthor');

        editor.addEventListener('paste', (e) => {
            e.preventDefault();
            let text = (e.originalEvent || e).clipboardData.getData('text/plain');
            const lines = text.split(/\r?\n/);
            if (lines.length === 1) {
                document.execCommand('insertText', false, lines[0]);
                return;
            }
            const html = lines.map(line => {
                if (line.trim() === '') return '<div><br></div>';
                return `<div>${line}</div>`;
            }).join('');
            document.execCommand('insertHTML', false, html);
        });

        document.getElementById('fontSize').addEventListener('input', (e) => {
            editor.style.fontSize = e.target.value + 'px';
            document.getElementById('val-size').innerText = e.target.value + 'px';
        });
        document.getElementById('letterSpacing').addEventListener('input', (e) => {
            editor.style.letterSpacing = e.target.value + 'px';
            document.getElementById('val-space').innerText = e.target.value + 'px';
        });
        document.getElementById('lineHeight').addEventListener('input', (e) => {
            editor.style.lineHeight = e.target.value;
            document.getElementById('val-line').innerText = e.target.value;
        });
        document.getElementById('pSpacing').addEventListener('input', (e) => {
            root.style.setProperty('--p-gap', e.target.value + 'px');
            document.getElementById('val-pgap').innerText = e.target.value + 'px';
        });
        document.getElementById('bgPadding').addEventListener('input', (e) => {
            root.style.setProperty('--padding', e.target.value + 'px');
            document.getElementById('val-padding').innerText = e.target.value + 'px';
        });

        document.getElementById('fontFamily').addEventListener('change', (e) => {
            captureWrapper.style.fontFamily = e.target.value;
        });
        
        document.getElementById('textAlign').addEventListener('change', (e) => {
            editor.style.textAlign = e.target.value;
        });

        document.getElementById('textColor').addEventListener('input', (e) => {
            root.style.setProperty('--text-color', e.target.value);
        });

        document.getElementById('bgColor').addEventListener('input', (e) => {
            root.style.setProperty('--bg-color', e.target.value);
        });

        document.getElementById('orientation').addEventListener('change', (e) => {
            if (e.target.value === 'portrait') {
                captureWrapper.classList.remove('landscape');
                captureWrapper.classList.add('portrait');
            } else {
                captureWrapper.classList.remove('portrait');
                captureWrapper.classList.add('landscape');
            }
        });

        document.getElementById('borderStyle').addEventListener('change', (e) => {
            root.style.setProperty('--border-style', e.target.value);
        });

        // 꼬리말 텍스트 업데이트 로직 (제목 │ 저자)
        function updateFooterText() {
            const title = footerTitleInput.value.trim();
            const author = footerAuthorInput.value.trim();
            
            if (title && author) {
                footerDisplay.innerText = `${title} │ ${author}`;
            } else if (title) {
                footerDisplay.innerText = title;
            } else if (author) {
                footerDisplay.innerText = author;
            } else {
                footerDisplay.innerText = '';
            }
        }

        // 드롭다운 선택 시 입력창에 값 반영
        titleSelect.addEventListener('change', function() {
            if (this.value !== "") {
                footerTitleInput.value = this.value;
            }
            updateFooterText();
        });
        
        authorSelect.addEventListener('change', function() {
            if (this.value !== "") {
                footerAuthorInput.value = this.value;
            }
            updateFooterText();
        });

        // 직접 입력 시에도 실시간 반영
        footerTitleInput.addEventListener('input', updateFooterText);
        footerAuthorInput.addEventListener('input', updateFooterText);

        document.getElementById('footerFontFamily').addEventListener('change', (e) => {
            if (e.target.value === 'inherit') {
                footerDisplay.style.fontFamily = 'inherit';
            } else {
                footerDisplay.style.fontFamily = e.target.value;
            }
        });

        document.getElementById('footerFontSize').addEventListener('input', (e) => {
            root.style.setProperty('--footer-size', e.target.value + 'px');
            document.getElementById('val-footer-size').innerText = e.target.value + 'px';
        });
        
        document.getElementById('footerLetterSpacing').addEventListener('input', (e) => {
            root.style.setProperty('--footer-space', e.target.value + 'px');
            document.getElementById('val-footer-space').innerText = e.target.value + 'px';
        });

        document.getElementById('footerColor').addEventListener('input', (e) => {
            root.style.setProperty('--footer-color', e.target.value);
        });

        function applyBold() { document.execCommand('bold', false, null); }
        function applyPartColor() {
            const color = document.getElementById('partColor').value;
            document.execCommand('foreColor', false, color);
        }
        function applyHighlight() {
            const color = document.getElementById('hlColor').value;
            document.execCommand('backColor', false, color);
        }
        function removeFormat() {
            document.execCommand('removeFormat', false, null);
            document.execCommand('backColor', false, 'transparent');
            document.execCommand('foreColor', false, 'inherit');
        }

        // 고화질 캡처 엔진 (scale 4배수 적용)
        async function generateCanvas() {
            const mainEl = document.getElementById('main');
            const origScrollTop = mainEl.scrollTop;
            const origScrollLeft = mainEl.scrollLeft;
            mainEl.scrollTop = 0;
            mainEl.scrollLeft = 0;
            
            const origShadow = captureWrapper.style.boxShadow;
            captureWrapper.style.boxShadow = 'none';
            
            await document.fonts.ready;
            await new Promise(r => setTimeout(r, 150)); 

            try {
                const canvas = await html2canvas(captureWrapper, {
                    scale: 4, // ✨ 4K급 초고화질 캡처를 위해 스케일을 4로 대폭 상향
                    useCORS: true,
                    backgroundColor: root.style.getPropertyValue('--bg-color') || '#ffffff',
                    logging: false,
                    onclone: function(clonedDoc) {
                        const editorClone = clonedDoc.getElementById('editor');
                        
                        const walk = clonedDoc.createTreeWalker(editorClone, NodeFilter.SHOW_TEXT, null, false);
                        const textNodes = [];
                        while(walk.nextNode()) textNodes.push(walk.currentNode);
                        
                        textNodes.forEach(node => {
                            if (!node.nodeValue.trim()) return;
                            const parent = node.parentNode;
                            const fragment = clonedDoc.createDocumentFragment();
                            const words = node.nodeValue.split(/(\s+)/);
                            
                            words.forEach(word => {
                                if (!word) return;
                                if (/\s+/.test(word)) {
                                    fragment.appendChild(clonedDoc.createTextNode(word));
                                } else {
                                    const span = clonedDoc.createElement('span');
                                    span.style.display = 'inline-block';
                                    span.style.verticalAlign = 'baseline';
                                    span.textContent = word;
                                    fragment.appendChild(span);
                                }
                            });
                            parent.replaceChild(fragment, node);
                        });
                    }
                });
                return canvas;
            } finally {
                mainEl.scrollTop = origScrollTop;
                mainEl.scrollLeft = origScrollLeft;
                captureWrapper.style.boxShadow = origShadow;
            }
        }

        async function downloadImage() {
            const btn = document.querySelector('.btn-primary');
            const originalText = btn.innerText;
            btn.innerText = "초고화질로 변환 중..."; // 고화질 렌더링 시 약간의 시간이 걸릴 수 있어 텍스트 변경

            try {
                const canvas = await generateCanvas();
                const link = document.createElement('a');
                link.download = 'LogSnap_HQ_' + Date.now() + '.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            } catch (err) {
                alert("오류가 발생했습니다: " + err);
            } finally {
                btn.innerText = originalText;
            }
        }
    </script>
</body>
</html>
