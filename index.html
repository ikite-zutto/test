<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>LogSnap - 로그 발췌 메이커</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <style>
        /* 구글 폰트 */
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&family=Nanum+Myeongjo:wght@400;700&family=Gowun+Dodum&family=Gowun+Batang&display=swap');
        
        /* 눈누 웹 폰트 모음 */
        @font-face { font-family: 'RIDIBatang'; src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_twelve@1.0/RIDIBatang.woff') format('woff'); font-weight: normal; font-style: normal; }
        @font-face { font-family: 'NeoDunggeunmo'; src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.3/NeoDunggeunmo.woff') format('woff'); font-weight: normal; font-style: normal; }
        @font-face { font-family: 'Pretendard-Regular'; src: url('https://cdn.jsdelivr.net/gh/Project-Noonnu/noonfonts_2107@1.1/Pretendard-Regular.woff') format('woff'); font-weight: 400; font-style: normal; }
        @font-face { font-family: 'MaruBuri'; src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2010-2107@1.0/MaruBuri-Regular.woff') format('woff'); font-weight: normal; font-style: normal; }
        @font-face { font-family: 'KyoboHandwriting2019'; src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_20-04@1.0/KyoboHandwriting2019.woff') format('woff'); font-weight: normal; font-style: normal; }
        @font-face { font-family: 'SpoqaHanSansNeo-Regular'; src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2108@1.1/SpoqaHanSansNeo-Regular.woff') format('woff'); font-weight: normal; font-style: normal; }
        @font-face { font-family: 'SUIT-Regular'; src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_suit@1.0/SUIT-Regular.woff2') format('woff2'); font-weight: normal; font-style: normal; }

        :root {
            --bg-color: #ffffff;
            --text-color: #333333;
            --p-gap: 12px;
            --padding: 60px;
        }

        * { box-sizing: border-box; }

        body { 
            font-family: 'Pretendard-Regular', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; 
            display: flex; 
            background: #f4f6f8; 
            margin: 0; 
            height: 100vh; 
            color: #333;
        }

        /* 왼쪽 설정 패널 */
        #sidebar { 
            width: 320px; background: #fff; padding: 25px; 
            box-shadow: 2px 0 15px rgba(0,0,0,0.03); 
            display: flex; flex-direction: column; gap: 20px; 
            overflow-y: auto; border-right: 1px solid #e9ecef;
        }
        #sidebar::-webkit-scrollbar { width: 6px; }
        #sidebar::-webkit-scrollbar-thumb { background: #ced4da; border-radius: 3px; }

        .logo { font-size: 22px; font-weight: 700; margin-bottom: 10px; color: #1c7ed6; letter-spacing: -0.5px; }
        .section-title { font-size: 13px; font-weight: 700; color: #868e96; margin-bottom: 8px; text-transform: uppercase; }
        
        .control-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 15px; }
        .control-group label { font-size: 13px; font-weight: 600; color: #495057; display: flex; justify-content: space-between;}
        
        input[type="range"] { accent-color: #1c7ed6; cursor: pointer; }
        select, input[type="file"] { padding: 8px; border: 1px solid #ced4da; border-radius: 6px; font-family: inherit; font-size: 13px; outline: none; cursor: pointer;}
        
        .btn-row { display: flex; gap: 8px; }
        button { 
            padding: 10px; cursor: pointer; border: none; border-radius: 6px; 
            font-weight: 600; font-size: 13px; transition: all 0.2s; 
            display: flex; align-items: center; justify-content: center; gap: 5px;
        }
        button:hover { filter: brightness(0.95); }
        
        .btn-theme { flex: 1; background: #f8f9fa; border: 1px solid #dee2e6; color: #495057; }
        .btn-action { background: #e7f5ff; color: #1c7ed6; flex: 1; }
        .btn-hl { background: #ffeaa7; color: #000; flex: 1; }
        .btn-clear { background: #f1f3f5; color: #495057; }
        
        .btn-primary { background: #1c7ed6; color: #fff; font-size: 15px; padding: 14px; margin-top: 10px; }
        .btn-secondary { background: #343a40; color: #fff; font-size: 15px; padding: 14px; }

        /* 오른쪽 미리보기 패널 */
        #main { 
            flex-grow: 1; display: flex; justify-content: center; align-items: center; 
            padding: 40px; overflow-y: auto; 
            background: repeating-linear-gradient(45deg, #f1f3f5, #f1f3f5 10px, #f8f9fa 10px, #f8f9fa 20px);
        }
        
        /* 캡처되는 도화지 영역 */
        #capture-wrapper { 
            background-color: var(--bg-color);
            padding: var(--padding); 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); 
            min-width: 500px; max-width: 800px; width: 100%;
            transition: padding 0.2s, background-color 0.3s;
            background-size: cover; background-position: center;
        }

        /* 텍스트 입력 영역 */
        #editor { 
            outline: none; min-height: 300px; font-size: 16px;
            line-height: 1.6; letter-spacing: 0px; word-break: keep-all;
            color: var(--text-color);
            font-family: 'Pretendard-Regular', 'Apple SD Gothic Neo', sans-serif; /* 기본 폰트를 프리텐다드로 설정 */
            transition: color 0.3s;
        }
        #editor p, #editor div { margin-top: 0; margin-bottom: var(--p-gap); }
        #editor strong { font-weight: 700; }
    </style>
</head>
<body>

    <!-- 왼쪽 설정 창 -->
    <div id="sidebar">
        <div class="logo">📸 LogSnap</div>

        <!-- 1. 테마 프리셋 -->
        <div>
            <div class="section-title">✨ 원클릭 테마</div>
            <div class="btn-row">
                <button class="btn-theme" onclick="setTheme('paper')">종이책</button>
                <button class="btn-theme" onclick="setTheme('dark')">다크모드</button>
                <button class="btn-theme" onclick="setTheme('trpg')">TRPG</button>
            </div>
        </div>

        <hr style="border: 0; border-top: 1px solid #f1f3f5;">

        <!-- 2. 폰트 및 텍스트 설정 -->
        <div>
            <div class="section-title">✍️ 텍스트 설정</div>
            
            <div class="control-group">
                <label>폰트 (글꼴)</label>
                <select id="fontFamily">
                    <optgroup label="[사진 속 그 폰트! / 깔끔 고딕]">
                        <option value="'Pretendard-Regular', sans-serif">프리텐다드 (추천✨)</option>
                        <option value="'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">애플/맑은 고딕 (기본)</option>
                        <option value="'SpoqaHanSansNeo-Regular', sans-serif">스포카 한 산스 네오</option>
                        <option value="'SUIT-Regular', sans-serif">SUIT (수트)</option>
                        <option value="'Noto Sans KR', sans-serif">노토산스</option>
                        <option value="'Gowun Dodum', sans-serif">고운돋움</option>
                    </optgroup>
                    <optgroup label="[소설 / 감성 바탕체]">
                        <option value="'RIDIBatang', serif">리디바탕</option>
                        <option value="'MaruBuri', serif">마루부리</option>
                        <option value="'Gowun Batang', serif">고운바탕</option>
                        <option value="'Nanum Myeongjo', serif">나눔명조</option>
                    </optgroup>
                    <optgroup label="[개성 / 특수]">
                        <option value="'KyoboHandwriting2019', cursive">교보 손글씨</option>
                        <option value="'NeoDunggeunmo', monospace">둥근모 (픽셀)</option>
                    </optgroup>
                </select>
            </div>

            <div class="control-group">
                <label>글자색 선택</label>
                <input type="color" id="textColor" value="#333333" style="width: 100%; height: 30px; border: 1px solid #ced4da; border-radius: 6px; padding: 2px;">
            </div>

            <div class="control-group">
                <label>글씨 크기 <span id="val-size">16px</span></label>
                <input type="range" id="fontSize" min="12" max="40" value="16">
            </div>
            <div class="control-group">
                <label>자간 (글자 간격) <span id="val-space">0px</span></label>
                <input type="range" id="letterSpacing" min="-3" max="10" value="0" step="0.5">
            </div>
            <div class="control-group">
                <label>줄 간격 <span id="val-line">1.6</span></label>
                <input type="range" id="lineHeight" min="1" max="3" value="1.6" step="0.1">
            </div>
            <div class="control-group">
                <label>문단 폭 (엔터 간격) <span id="val-pgap">12px</span></label>
                <input type="range" id="pSpacing" min="0" max="50" value="12" step="1">
            </div>
        </div>

        <hr style="border: 0; border-top: 1px solid #f1f3f5;">

        <!-- 3. 꾸미기 (화자분리, 형광펜) -->
        <div>
            <div class="section-title">🎨 꾸미기 & 화자 분리</div>
            <div class="control-group">
                <button class="btn-action" onclick="applySmartSpeaker()">🤖 스마트 화자 분리 (이름 굵게)</button>
                <p style="font-size:11px; color:#adb5bd; margin:2px 0 10px 0; text-align:center;">'이름 : 대사' 형식을 자동으로 분리합니다.</p>
            </div>
            <div class="control-group">
                <div class="btn-row">
                    <input type="color" id="hlColor" value="#ffeaa7" style="width: 38px; height: 38px; padding: 0; border: 1px solid #ced4da; border-radius: 6px;">
                    <button class="btn-hl" onclick="applyHighlight()">형광펜 칠하기</button>
                    <button class="btn-clear" onclick="removeFormat()">지우기</button>
                </div>
            </div>
        </div>

        <hr style="border: 0; border-top: 1px solid #f1f3f5;">

        <!-- 4. 배경 및 여백 -->
        <div>
            <div class="section-title">🖼️ 배경 & 여백</div>
            <div class="control-group">
                <label>여백 넓히기 <span id="val-padding">60px</span></label>
                <input type="range" id="bgPadding" min="20" max="150" value="60" step="5">
            </div>
            <div class="control-group">
                <label>배경색 선택</label>
                <input type="color" id="bgColor" value="#ffffff" style="width: 100%; height: 30px; border: 1px solid #ced4da; border-radius: 6px; padding: 2px;">
            </div>
            <div class="control-group">
                <label>배경 이미지 업로드</label>
                <input type="file" id="bgImage" accept="image/*">
            </div>
        </div>

        <!-- 5. 내보내기 -->
        <div style="margin-top: 10px;">
            <button class="btn-primary" style="width:100%;" onclick="copyToClipboard()">📋 클립보드에 복사 (Ctrl+V용)</button>
            <button class="btn-secondary" style="width:100%; margin-top:8px;" onclick="downloadImage()">💾 고화질 이미지 저장</button>
        </div>
    </div>

    <!-- 오른쪽 도화지 창 -->
    <div id="main">
        <div id="capture-wrapper">
            <div id="editor" contenteditable="true">노먼의 손이 허공에서 멈추었다. 세라핀이 고개를 돌린 방향, 그녀의 뒷통수에 달빛이 내려앉아 백색 곱슬머리를 은빛으로 물들이고 있었다.

노먼 : ......그래. 이 손은 고운 적이 없어.

여기에 로그를 복사해서 붙여넣으세요.
스마트 화자 분리 버튼을 누르면 이름만 굵게 변합니다!</div>
        </div>
    </div>

    <script>
        const editor = document.getElementById('editor');
        const root = document.documentElement;
        const captureWrapper = document.getElementById('capture-wrapper');

        // 슬라이더 실시간 적용
        const sliders = [
            { id: 'fontSize', style: 'fontSize', unit: 'px', target: editor },
            { id: 'letterSpacing', style: 'letterSpacing', unit: 'px', target: editor },
            { id: 'lineHeight', style: 'lineHeight', unit: '', target: editor }
        ];

        sliders.forEach(s => {
            document.getElementById(s.id).addEventListener('input', (e) => {
                s.target.style[s.style] = e.target.value + s.unit;
                document.getElementById(`val-${s.id.replace(/([A-Z])/g, '-$1').toLowerCase().split('-')[1] || s.id}`).innerText = e.target.value + s.unit;
            });
        });

        // 문단 간격 & 여백 적용
        document.getElementById('pSpacing').addEventListener('input', (e) => {
            root.style.setProperty('--p-gap', e.target.value + 'px');
            document.getElementById('val-pgap').innerText = e.target.value + 'px';
        });

        document.getElementById('bgPadding').addEventListener('input', (e) => {
            root.style.setProperty('--padding', e.target.value + 'px');
            document.getElementById('val-padding').innerText = e.target.value + 'px';
        });

        // 폰트 변경
        document.getElementById('fontFamily').addEventListener('change', (e) => {
            editor.style.fontFamily = e.target.value;
        });

        // 색상 변경
        document.getElementById('textColor').addEventListener('input', (e) => {
            root.style.setProperty('--text-color', e.target.value);
        });

        document.getElementById('bgColor').addEventListener('input', (e) => {
            root.style.setProperty('--bg-color', e.target.value);
            captureWrapper.style.backgroundImage = 'none';
        });

        document.getElementById('bgImage').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if(file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    captureWrapper.style.backgroundImage = `url(${event.target.result})`;
                }
                reader.readAsDataURL(file);
            }
        });

        // 형광펜 기능
        function applyHighlight() {
            const color = document.getElementById('hlColor').value;
            document.execCommand('backColor', false, color);
        }
        function removeFormat() {
            document.execCommand('backColor', false, 'transparent');
            document.execCommand('bold', false, null);
        }

        // 스마트 화자 분리
        function applySmartSpeaker() {
            const textLines = editor.innerText.split('\n');
            const newHtml = textLines.map(line => {
                const match = line.match(/^(.*?)(:|：)(.*)$/);
                if (match) {
                    return `<strong>${match[1]}</strong>${match[2]}${match[3]}`;
                }
                return line;
            }).join('<br>');
            editor.innerHTML = newHtml;
        }

        // 원클릭 테마 프리셋
        function setTheme(type) {
            captureWrapper.style.backgroundImage = 'none';
            const textColorInput = document.getElementById('textColor');
            const bgColorInput = document.getElementById('bgColor');
            const fontSelect = document.getElementById('fontFamily');

            if (type === 'paper') {
                root.style.setProperty('--bg-color', '#fdfbf7'); 
                root.style.setProperty('--text-color', '#3e3a39');
                textColorInput.value = '#3e3a39'; bgColorInput.value = '#fdfbf7';
                fontSelect.value = "'RIDIBatang', serif"; editor.style.fontFamily = "'RIDIBatang', serif";
            } else if (type === 'dark') {
                root.style.setProperty('--bg-color', '#212529'); 
                root.style.setProperty('--text-color', '#f8f9fa');
                textColorInput.value = '#f8f9fa'; bgColorInput.value = '#212529';
                fontSelect.value = "'Pretendard-Regular', sans-serif"; editor.style.fontFamily = "'Pretendard-Regular', sans-serif";
            } else if (type === 'trpg') {
                root.style.setProperty('--bg-color', '#000000'); 
                root.style.setProperty('--text-color', '#39ff14'); 
                textColorInput.value = '#39ff14'; bgColorInput.value = '#000000';
                fontSelect.value = "'NeoDunggeunmo', monospace"; editor.style.fontFamily = "'NeoDunggeunmo', monospace";
            }
        }

        // 캡처 공통 옵션
        const getCanvasOptions = () => ({ scale: 2, useCORS: true, backgroundColor: null });

        // 클립보드 복사
        function copyToClipboard() {
            const btn = document.querySelector('.btn-primary');
            const originalText = btn.innerText;
            btn.innerText = "⏳ 복사 중...";
            html2canvas(captureWrapper, getCanvasOptions()).then(canvas => {
                canvas.toBlob(blob => {
                    try {
                        const item = new ClipboardItem({ 'image/png': blob });
                        navigator.clipboard.write([item]).then(() => {
                            btn.innerText = "✅ 복사 완료! (Ctrl+V)";
                            setTimeout(() => btn.innerText = originalText, 2000);
                        });
                    } catch (err) {
                        alert("브라우저가 이미지 클립보드 복사를 지원하지 않습니다. 저장을 이용해주세요.");
                        btn.innerText = originalText;
                    }
                });
            });
        }

        // 고화질 이미지 저장
        function downloadImage() {
            const btn = document.querySelector('.btn-secondary');
            const originalText = btn.innerText;
            btn.innerText = "⏳ 저장 중...";
            html2canvas(captureWrapper, getCanvasOptions()).then(canvas => {
                const link = document.createElement('a');
                link.download = 'LogSnap_' + Date.now() + '.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
                btn.innerText = originalText;
            });
        }
    </script>
</body>
</html>
